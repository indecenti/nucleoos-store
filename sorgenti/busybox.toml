# **Draft**: the upstream URL is missing, so this entry stays out of
# the index. The binary is proven and the hash is its own; what is
# missing is provenance, and that is not invented.
bozza    = true

nome     = "busybox"
versione = "1.36.1"
origine  = "busybox.net"
# The official static asset for x86_64-linux-musl. To be filled with the
# exact URL of the version published: CI refuses an entry without one.
url      = ""
# The hash of the binary **already proven** under `linuxd`
# (2026-09-21). When the URL is filled in, this must match the checksum
# busybox.net publishes for that version: if it does not, it is not the
# same file, and the entry is redone, not adjusted.
sha256   = "dbac288c29ba568459550a2da9e7ae0ded6b1fc728ee9fad3044c44e62d6ac14"

# Hundreds of applets in a two-megabyte file. `echo` is the shortest
# proof of the whole round: it loads, writes to the console, exits 0.
prova    = { args = ["echo", "ciao"], uscita = 0 }

# It touches nothing outside itself: with no roots it sees no files.
poteri   = { radici = [], pagine = 4096 }
