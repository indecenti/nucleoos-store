# **Draft**: the upstream URL is missing, so this entry stays out of
# the index. The binary is proven and the hash is its own; what is
# missing is provenance, and that is not invented.
bozza    = true

nome     = "rg"
versione = "14.1.0"
origine  = "github.com/BurntSushi/ripgrep"
# The `x86_64-unknown-linux-musl` asset. To be filled: CI refuses an
# entry without a URL.
url      = ""
# The hash of the binary already proven under `linuxd` (2026-09-21): a
# static-PIE that uses threads and futexes, and stage B's criterion is
# exactly this one with four threads.
sha256   = "e62198eb19b136b88c330af83647b5a962cb99b6b1f066758568f12de1974849"

# Search for a word that is there and one that is not: the first must
# exit 0. A `rg` that always exited 0 would pass a single-sided proof
# and not be doing its job.
prova    = { args = ["-j4", "nucleo", "/dati"], uscita = 0 }

# It wants a folder to search, read-only.
poteri   = { radici = ["/dati"], pagine = 8192 }
