# Le voci del catalogo si leggono, a ogni spinta.
#
# **Non e' ancora il CI che pubblica** (`plans/APP-DI-TERZI.md` §7.2):
# quello scarica, avvia NucleoOS in QEMU, fa girare ogni binario sotto
# `linuxd` e firma l'indice, e ha bisogno della repo di NucleoOS per
# costruire le immagini. Questo qui e' il primo gradino, e vale per conto
# suo: fa rispettare la forma di una voce **prima** che qualcuno ci
# costruisca sopra.
name: sorgenti

on:
  push:
    paths: ["sorgenti/**", "ci/**", ".github/workflows/sorgenti.yml"]
  pull_request:
    paths: ["sorgenti/**", "ci/**"]

jobs:
  valida:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # `tomllib` sta nella libreria standard da 3.11: nessuna dipendenza
      # da installare, e niente da tenere aggiornato.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: le prove dei controlli
        run: cd ci && python3 prove_valida.py && python3 prove_prendi.py
      - name: le voci
        run: python3 ci/valida.py
      # Scaricare e verificare: oggi non fa niente, perche' le voci sono
      # tutte bozze. Sta qui lo stesso, cosi' il giorno che una voce ha
      # l'URL il giro e' gia' cablato e non si scopre allora se funziona.
      - name: prendi le voci pronte
        run: python3 ci/prendi.py

