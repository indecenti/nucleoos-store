# Catalogue entries parse, on every push.
#
# **This is not yet the CI that publishes** (`plans/APP-DI-TERZI.md`
# §7.2): that one downloads, boots NucleoOS in QEMU, runs each binary
# under `linuxd` and signs the index, and it needs the NucleoOS
# repository to build the images. This is the first step, and it stands
# on its own: it enforces the shape of an entry **before** anyone builds
# on top of it.
name: sorgenti

on:
  push:
    paths: ["sorgenti/**", "ci/**", ".github/workflows/sorgenti.yml"]
  pull_request:
    paths: ["sorgenti/**", "ci/**"]

jobs:
  valida:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # `tomllib` has been in the standard library since 3.11: nothing to
      # install, nothing to keep up to date.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the checks' own tests
        run: cd ci && python3 prove_valida.py && python3 prove_prendi.py
      - name: the entries
        run: python3 ci/valida.py
      # Fetch and verify: today it does nothing, because every entry is a
      # draft. It is wired up anyway, so that the day an entry has a URL
      # we do not find out then whether the round works.
      - name: fetch the ready entries
        run: python3 ci/prendi.py

